services:
  crawler:
    build: .
    volumes:
      - ./downloads:/app/downloads

  ingestion:
    build: ./ingestion
    volumes:
      - ./downloads:/app/downloads:ro
      - ./ingested:/app/ingested

  embedding:
    build: ./embedding
    volumes:
      - ./ingested:/app/ingested:ro
      - ./embedded:/app/embedded
